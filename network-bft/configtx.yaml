# Канал bftchannel с Ordering Service SmartBFT (BFT, n = 3f + 1 = 4, f = 1). Fabric 3.1.x.
Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: organizations/ordererOrganizations/example.com/msp
    Policies:
      Readers: { Type: Signature, Rule: "OR('OrdererMSP.member')" }
      Writers: { Type: Signature, Rule: "OR('OrdererMSP.member')" }
      Admins:  { Type: Signature, Rule: "OR('OrdererMSP.admin')" }
    OrdererEndpoints: [localhost:7150, localhost:7160, localhost:7170, localhost:7180]
  - &Org1
    Name: Org1MSP
    ID: Org1MSP
    MSPDir: organizations/peerOrganizations/org1.example.com/msp
    Policies:
      Readers:     { Type: Signature, Rule: "OR('Org1MSP.admin', 'Org1MSP.peer', 'Org1MSP.client')" }
      Writers:     { Type: Signature, Rule: "OR('Org1MSP.admin', 'Org1MSP.client')" }
      Admins:      { Type: Signature, Rule: "OR('Org1MSP.admin')" }
      Endorsement: { Type: Signature, Rule: "OR('Org1MSP.peer')" }

Capabilities:
  Channel:     &ChannelCapabilities     { V3_0: true }   # обязательна для BFT
  Orderer:     &OrdererCapabilities     { V2_0: true }
  Application: &ApplicationCapabilities { V2_5: true }

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:              { Type: ImplicitMeta, Rule: "ANY Readers" }
    Writers:              { Type: ImplicitMeta, Rule: "ANY Writers" }
    Admins:               { Type: ImplicitMeta, Rule: "MAJORITY Admins" }
    LifecycleEndorsement: { Type: ImplicitMeta, Rule: "MAJORITY Endorsement" }
    Endorsement:          { Type: ImplicitMeta, Rule: "MAJORITY Endorsement" }
  Capabilities: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: BFT
  BatchTimeout: 2s
  BatchSize: { MaxMessageCount: 10, AbsoluteMaxBytes: 99 MB, PreferredMaxBytes: 512 KB }
  SmartBFT:
    RequestBatchMaxCount: 100
    RequestBatchMaxInterval: 50ms
    RequestForwardTimeout: 2s
    RequestComplainTimeout: 10s        # по умолчанию 20s; уменьшено для лабораторного стенда
    RequestAutoRemoveTimeout: 3m0s
    ViewChangeResendInterval: 5s
    ViewChangeTimeout: 10s             # по умолчанию 20s
    LeaderHeartbeatTimeout: 10s        # по умолчанию 1m0s
    LeaderHeartbeatCount: 10
    CollectTimeout: 1s
    RequestBatchMaxBytes: 10485760
    IncomingMessageBufferSize: 200
    RequestPoolSize: 100000
  ConsenterMapping:
    - ID: 1
      Host: localhost
      Port: 7150
      MSPID: OrdererMSP
      ClientTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer1.example.com/tls/server.crt
      ServerTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer1.example.com/tls/server.crt
      Identity: organizations/ordererOrganizations/example.com/orderers/orderer1.example.com/msp/signcerts/orderer1.example.com-cert.pem
    - ID: 2
      Host: localhost
      Port: 7160
      MSPID: OrdererMSP
      ClientTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer2.example.com/tls/server.crt
      ServerTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer2.example.com/tls/server.crt
      Identity: organizations/ordererOrganizations/example.com/orderers/orderer2.example.com/msp/signcerts/orderer2.example.com-cert.pem
    - ID: 3
      Host: localhost
      Port: 7170
      MSPID: OrdererMSP
      ClientTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer3.example.com/tls/server.crt
      ServerTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer3.example.com/tls/server.crt
      Identity: organizations/ordererOrganizations/example.com/orderers/orderer3.example.com/msp/signcerts/orderer3.example.com-cert.pem
    - ID: 4
      Host: localhost
      Port: 7180
      MSPID: OrdererMSP
      ClientTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer4.example.com/tls/server.crt
      ServerTLSCert: organizations/ordererOrganizations/example.com/orderers/orderer4.example.com/tls/server.crt
      Identity: organizations/ordererOrganizations/example.com/orderers/orderer4.example.com/msp/signcerts/orderer4.example.com-cert.pem
  Organizations:
  Policies:
    Readers:         { Type: ImplicitMeta, Rule: "ANY Readers" }
    Writers:         { Type: ImplicitMeta, Rule: "ANY Writers" }
    Admins:          { Type: ImplicitMeta, Rule: "MAJORITY Admins" }
    BlockValidation: { Type: ImplicitMeta, Rule: "ANY Writers" }

Channel: &ChannelDefaults
  Policies:
    Readers: { Type: ImplicitMeta, Rule: "ANY Readers" }
    Writers: { Type: ImplicitMeta, Rule: "ANY Writers" }
    Admins:  { Type: ImplicitMeta, Rule: "MAJORITY Admins" }
  Capabilities: *ChannelCapabilities

Profiles:
  ChannelUsingBFT:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations: [*OrdererOrg]
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations: [*Org1]
      Capabilities: *ApplicationCapabilities
